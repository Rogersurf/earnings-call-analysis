services:

  backend:

    build:

      context: .

      dockerfile: backend/Dockerfile

    ports:

      - "8000:8000"

    volumes:

      - .:/app

  frontend:

    build:

      context: .

      dockerfile: frontend/Dockerfile

    ports:

      - "5173:5173"

    working_dir: /app

    volumes:

      - ./frontend:/app

    depends_on:

      - backend